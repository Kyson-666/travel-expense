# 旅行经费工作台 · 多用户版 — 单容器全栈编排
# 前端静态资源由后端内置托管（端口 3000 直出），复制本文件即可安装：
#   1. 在宿主机建数据目录（如 /volume1/docker/travel）并 chmod 可写
#   2. 把本文件放到该目录，执行：docker compose up -d
#   3. 浏览器打开 http://<你的NAS>:8108 ，管理员 admin / 123456（首登强制改密）
#
# 日志查看（两种方式，二选一）：
#   A. 实时容器控制台： docker compose logs -f
#   B. 持久化到挂载卷： tail -F /volume1/docker/travel/logs/app.log
#      注意：不需要单独挂载 logs 目录！entrypoint 自动在 $DATA_DIR 下创建 logs/ 子目录，
#      因此日志文件和 app.db 共享同一个数据卷，随数据一起持久化迁移
services:
  travel-expense:
    # 安卓客户端（Capacitor）需要服务端开启跨域：v1.0.5 起支持 /api/public/server-check、
    # 账号归属校验（404 ACCOUNT_NOT_FOUND）、CORS 与跨域会话 Cookie。
    image: ghcr.io/hanyuestar/travel-expense:v1.2.3
    # 如访问 ghcr.io 较慢，可改用 Docker Hub 镜像（内容一致）：
    #   image: kyson666/travel-expense:v1.2.3
    container_name: travel-expense
    restart: unless-stopped
    ports:
      - "8108:3000"   # 主机端口 8108 -> 容器 3000；想换端口只改左侧数字
    volumes:
      - /volume1/docker/travel:/data   # 数据持久化：app.db、种子 routes.json、日志 logs/ 都在这
    environment:
      - PORT=3000
      - DATA_DIR=/data
      # ↓↓↓ 安卓 APP 直连所需（否则 APP 内登录态无法持久化 / 跨域被拒）↓↓↓
      # 服务器处于 HTTPS 反向代理之后必须置 true，跨域会话 Cookie 才会带 Secure 被 WebView 接受
      - COOKIE_SECURE=true
      # 允许安卓 WebView 来源跨域调用 API 并携带凭证；* 表示允许任意来源（自托管场景可接受），
      # 也可改为更严格的 'http://localhost'（安卓 WebView 默认来源）
      - ALLOWED_ORIGINS=*
